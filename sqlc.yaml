version: "2"
sql:
  - engine: postgresql
    schema: migrations/postgresql
    queries: queries/postgresql
    gen:
      go:
        package: database
        out: internal/platform/database
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_interface: true
        rename:
          cfe: CVE
        overrides:
          - db_type: uuid
            go_type:
              import: uuid
              type: UUID
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: pg_catalog.float8
            nullable: true
            go_type:
              type: float64
              pointer: true
          - db_type: date
            go_type:
              import: time
              type: Time
          - db_type: date
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
