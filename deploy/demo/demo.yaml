apiVersion: relic.build/v1
kind: Repository
metadata: {name: npm-local}
spec: {class: local, format: npm, description: npm packages}
---
apiVersion: relic.build/v1
kind: Repository
metadata: {name: maven-local}
spec: {class: local, format: maven, description: Maven artifacts}
---
apiVersion: relic.build/v1
kind: Repository
metadata: {name: pypi-local}
spec: {class: local, format: pypi, description: Python packages}
---
apiVersion: relic.build/v1
kind: Repository
metadata: {name: docker-local}
spec: {class: local, format: docker, description: Container images}
---
apiVersion: relic.build/v1
kind: Repository
metadata: {name: go-local}
spec: {class: local, format: gomod, description: Go modules}
---
apiVersion: relic.build/v1
kind: Repository
metadata: {name: helm-local}
spec: {class: local, format: helm, description: Helm charts}
---
apiVersion: relic.build/v1
kind: Repository
metadata: {name: generic-local}
spec: {class: local, format: generic, description: "Files, with a planted secret and a weak Dockerfile"}
---
apiVersion: relic.build/v1
kind: Repository
metadata: {name: npm}
spec: {class: virtual, format: npm, description: npm packages, virtual: {members: [npm-local]}}
---
apiVersion: relic.build/v1
kind: Repository
metadata: {name: maven}
spec: {class: virtual, format: maven, description: Maven artifacts, virtual: {members: [maven-local]}}
---
apiVersion: relic.build/v1
kind: Repository
metadata: {name: pypi}
spec: {class: virtual, format: pypi, description: Python packages, virtual: {members: [pypi-local]}}
---
apiVersion: relic.build/v1
kind: Repository
metadata: {name: docker}
spec: {class: virtual, format: docker, description: Container images, virtual: {members: [docker-local]}}
---
apiVersion: relic.build/v1
kind: Group
metadata: {name: demo}
spec: {description: Visitors of the demo}
---
apiVersion: relic.build/v1
kind: User
metadata: {name: demo}
spec: {email: demo@relic.build, password: demo, groups: [demo]}
---
apiVersion: relic.build/v1
kind: Permission
metadata: {name: demo}
spec:
  rules:
    - resource: repository
      selector:
        repositories: [npm-local, maven-local, pypi-local, docker-local, go-local, helm-local, generic-local, npm, maven, pypi, docker]
      include: ["**"]
      grants: [{group: demo, actions: [read]}]
    - resource: build
      include: ["**"]
      grants: [{group: demo, actions: [read]}]
    - resource: release
      include: ["**"]
      grants: [{group: demo, actions: [read]}]
---
apiVersion: relic.build/v1
kind: Policy
metadata: {name: critical-vulnerabilities}
spec:
  kind: security
  description: Flags critical vulnerabilities, malicious packages and secrets
  rules:
    - {name: critical, priority: 1, minSeverity: critical}
    - {name: malicious, priority: 2, malicious: true}
    - {name: secrets, priority: 3, secrets: true}
    - {name: misconfigurations, priority: 4, misconfigurations: true}
---
apiVersion: relic.build/v1
kind: Policy
metadata: {name: permissive-licenses}
spec:
  kind: license
  description: Allows permissive licenses only
  rules:
    - name: permissive
      priority: 1
      allowedLicenses: [MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD]
---
apiVersion: relic.build/v1
kind: Watch
metadata: {name: everything}
spec:
  description: Every repository against both policies
  active: true
  scopes: [{kind: repository, all: true}]
  policies: [critical-vulnerabilities, permissive-licenses]
