syntax = "proto3";

package relic.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "relic/v1/options.proto";

// RepositoryService manages repositories.
service RepositoryService {
  // ListRepositories returns the repositories the caller may read.
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse) {
    option (relic.v1.access) = ACCESS_AUTHENTICATED;
    option (google.api.http) = {
      get: "/api/v1/repositories"
    };
  }
  // GetRepository returns one repository the caller may read.
  rpc GetRepository(GetRepositoryRequest) returns (GetRepositoryResponse) {
    option (relic.v1.access) = ACCESS_AUTHENTICATED;
    option (google.api.http) = {
      get: "/api/v1/repositories/{name}"
    };
  }
  // GetRepositorySigningKey returns the public key of the key pair that signs
  // the metadata of an Alpine, Debian or RPM repository the caller may read,
  // creating the key pair as signing would.
  rpc GetRepositorySigningKey(GetRepositorySigningKeyRequest) returns (GetRepositorySigningKeyResponse) {
    option (relic.v1.access) = ACCESS_AUTHENTICATED;
    option (google.api.http) = {
      get: "/api/v1/repositories/{name}/signing-key"
    };
  }
  // GetClientEndpoints returns where clients reach a repository: its files
  // over the Relic API, and the URL its format's package manager uses.
  rpc GetClientEndpoints(GetClientEndpointsRequest) returns (GetClientEndpointsResponse) {
    option (relic.v1.access) = ACCESS_AUTHENTICATED;
    option (google.api.http) = {
      get: "/api/v1/repositories/{name}/client-endpoints"
    };
  }
  // CreateRepository creates a repository. Administrators may, and a
  // project's admins in their project.
  rpc CreateRepository(CreateRepositoryRequest) returns (CreateRepositoryResponse) {
    option (relic.v1.access) = ACCESS_AUTHENTICATED;
    option (google.api.http) = {
      post: "/api/v1/repositories"
      body: "repository"
    };
  }
  // UpdateRepository replaces a repository's settings. An empty remote
  // password keeps the stored one. Administrators may, and a project's admins
  // within their project.
  rpc UpdateRepository(UpdateRepositoryRequest) returns (UpdateRepositoryResponse) {
    option (relic.v1.access) = ACCESS_AUTHENTICATED;
    option (google.api.http) = {
      put: "/api/v1/repositories/{repository.name}"
      body: "repository"
    };
  }
  // DeleteRepository deletes a repository and everything in it.
  // Administrators may, and a project's admins in their project.
  rpc DeleteRepository(DeleteRepositoryRequest) returns (DeleteRepositoryResponse) {
    option (relic.v1.access) = ACCESS_AUTHENTICATED;
    option (google.api.http) = {
      delete: "/api/v1/repositories/{name}"
    };
  }
}

// RepositoryClass is what a repository does.
enum RepositoryClass {
  REPOSITORY_CLASS_UNSPECIFIED = 0;
  // Files deployed to Relic.
  REPOSITORY_CLASS_LOCAL = 1;
  // A caching proxy of an upstream.
  REPOSITORY_CLASS_REMOTE = 2;
  // An aggregate of other repositories.
  REPOSITORY_CLASS_VIRTUAL = 3;
}

// Format is the kind of packages a repository holds.
enum Format {
  FORMAT_UNSPECIFIED = 0;
  FORMAT_ALPINE = 1;
  FORMAT_ANSIBLE = 2;
  FORMAT_BOWER = 3;
  FORMAT_CARGO = 4;
  FORMAT_CHEF = 5;
  FORMAT_COCOAPODS = 6;
  FORMAT_COMPOSER = 7;
  FORMAT_CONAN = 8;
  FORMAT_CONDA = 9;
  FORMAT_CRAN = 10;
  FORMAT_DEBIAN = 11;
  FORMAT_DOCKER = 12;
  FORMAT_GENERIC = 13;
  FORMAT_GIT_LFS = 14;
  FORMAT_GOMOD = 15;
  FORMAT_GRADLE = 16;
  FORMAT_HELM = 17;
  FORMAT_HELM_OCI = 18;
  FORMAT_HUGGINGFACE = 19;
  FORMAT_IVY = 20;
  FORMAT_MACHINE_LEARNING = 21;
  FORMAT_MAVEN = 22;
  FORMAT_NIX = 23;
  FORMAT_NPM = 24;
  FORMAT_NUGET = 25;
  FORMAT_OCI = 26;
  FORMAT_OPKG = 27;
  FORMAT_P2 = 28;
  FORMAT_PUB = 29;
  FORMAT_PUPPET = 30;
  FORMAT_PYPI = 31;
  FORMAT_RPM = 32;
  FORMAT_RUBYGEMS = 33;
  FORMAT_SBT = 34;
  FORMAT_SWIFT = 35;
  FORMAT_TERRAFORM = 36;
  FORMAT_TERRAFORM_BACKEND = 37;
  FORMAT_VAGRANT = 38;
  FORMAT_VCS = 39;
  // Relic's own repositories: build information, releases and evidence.
  FORMAT_BUILD = 40;
  FORMAT_RELEASE = 41;
  FORMAT_EVIDENCE = 42;
  // FORMAT_MCP holds MCP server definitions (server.json), served through the
  // MCP registry API once approved.
  FORMAT_MCP = 43;
  // FORMAT_SKILLS holds agent skill bundles: zip files with a SKILL.md.
  FORMAT_SKILLS = 44;
}

// RemoteRepositorySettings is how a remote repository reaches its upstream.
message RemoteRepositorySettings {
  string url = 1;
  string username = 2;
  // password is never returned; an update without one keeps the stored one.
  string password = 3;
  bool offline = 4;
  // disable_cache serves upstream files without keeping them.
  bool disable_cache = 5;
  // cache_period_seconds is how long metadata is served before it is
  // checked again; 0 uses the default.
  int64 cache_period_seconds = 6;
  // timeout_milliseconds bounds each upstream request; 0 uses the default.
  int64 timeout_milliseconds = 7;
  // index_url is the upstream's package index when it is not url (the PyPI
  // registry, a NuGet v3 feed).
  string index_url = 8;
  // missed_retrieval_cache_period_seconds is how long a file the upstream
  // does not have (404, 410) is not asked for again: 1800 when unset, never
  // when 0.
  optional int64 missed_retrieval_cache_period_seconds = 9;
  // cooldown_days hides and refuses versions published upstream more
  // recently (npm, PyPI): the main defence against fresh malware.
  int32 cooldown_days = 10;
  // quarantine holds what the repository caches until Relic Scan finds it
  // not malicious, or an administrator releases it.
  bool quarantine = 11;
}

// VirtualRepositorySettings is what a virtual repository aggregates.
message VirtualRepositorySettings {
  // members are resolved in order.
  repeated string members = 1;
  // deploy_to is the member that receives uploads; empty refuses them.
  string deploy_to = 2;
  // local_only_patterns are Ant patterns on package names or paths that
  // resolve only from local members, never from remote ones (dependency
  // confusion protection), for example @acme/* or com/acme.
  repeated string local_only_patterns = 3;
}

// Repository is a repository and its settings.
message Repository {
  string name = 1;
  RepositoryClass class = 2;
  // format is generic when unspecified.
  Format format = 3;
  string project = 4;
  string description = 5;
  string notes = 6;
  repeated string environments = 7;
  // signing_key names the key pair that signs the repository's metadata.
  string signing_key = 8;
  // architectures are the Debian architectures a virtual repository merges.
  repeated string architectures = 9;
  RemoteRepositorySettings remote = 10;
  VirtualRepositorySettings virtual = 11;
  google.protobuf.Timestamp created = 12;
  google.protobuf.Timestamp updated = 13;
  // max_upload_size is the largest file a local repository accepts, in
  // bytes; 0 leaves only the server's limit (RELIC_MAX_UPLOAD_SIZE).
  int64 max_upload_size = 14;
  // max_storage is the most a local repository's files may take, in bytes;
  // 0 is no quota.
  int64 max_storage = 15;
  // used_bytes is the size of the repository's files (GetRepository only).
  int64 used_bytes = 16;
  // immutable refuses replacing a file with other content; a redeploy of the
  // same content is allowed.
  bool immutable = 17;
  // metadata_depth is how many folders below the root an RPM repository's
  // repodata folders are; each indexes the packages beneath it.
  int32 metadata_depth = 18;
  // secondary_signing_key names a second key pair of an Alpine, Debian or RPM
  // repository: it also signs Alpine and Debian metadata, and its public key
  // is published with signing_key's.
  string secondary_signing_key = 19;
}

message ListRepositoriesRequest {
  // class and format filter the list when set.
  RepositoryClass class = 1;
  Format format = 2;
}

message ListRepositoriesResponse {
  repeated Repository repositories = 1;
}

message GetRepositoryRequest {
  string name = 1;
}

message GetRepositorySigningKeyRequest {
  string name = 1;
}

message GetRepositorySigningKeyResponse {
  // key_pair names the key pair; Alpine clients name the key file after it.
  string key_pair = 1;
  string public_key = 2;
  // secondary_key_pair names the repository's secondary signing key, if any.
  string secondary_key_pair = 3;
  string secondary_public_key = 4;
}

message GetRepositoryResponse {
  Repository repository = 1;
  // can_upload says the caller may upload to some path of the repository:
  // of its deploy target, for a virtual repository; never for a remote one.
  bool can_upload = 2;
  // can_delete says the caller may delete some path of the repository; never
  // for a virtual one.
  bool can_delete = 3;
}

message CreateRepositoryRequest {
  Repository repository = 1;
}

message CreateRepositoryResponse {
  Repository repository = 1;
}

message UpdateRepositoryRequest {
  Repository repository = 1;
}

message UpdateRepositoryResponse {
  Repository repository = 1;
}

message DeleteRepositoryRequest {
  string name = 1;
}

message DeleteRepositoryResponse {}

message GetClientEndpointsRequest {
  string name = 1;
}

message GetClientEndpointsResponse {
  // files is the base URL of the repository's files over the Relic API
  // (<files><path> downloads and uploads).
  string files = 1;
  // package_manager is the URL the format's client points at: the npm
  // registry, Maven or Helm repository, PyPI index or Go proxy; empty for
  // formats that have none.
  string package_manager = 2;
  // container_registry is the image prefix for docker and OCI clients
  // (<host>/<repository>); empty for other formats.
  string container_registry = 3;
}
