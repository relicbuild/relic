syntax = "proto3";

package relic.v1;

import "google/api/annotations.proto";
import "relic/v1/options.proto";

// IdentityProviderService manages the identity providers users sign in with
// (single sign-on through OpenID Connect or SAML).
service IdentityProviderService {
  rpc ListIdentityProviders(ListIdentityProvidersRequest) returns (ListIdentityProvidersResponse) {
    option (relic.v1.access) = ACCESS_VIEWER;
    option (google.api.http) = {
      get: "/api/v1/identity-providers"
    };
  }
  rpc GetIdentityProvider(GetIdentityProviderRequest) returns (GetIdentityProviderResponse) {
    option (relic.v1.access) = ACCESS_VIEWER;
    option (google.api.http) = {
      get: "/api/v1/identity-providers/{name}"
    };
  }
  // PutIdentityProvider creates or replaces an identity provider. An empty
  // client secret keeps the stored one.
  rpc PutIdentityProvider(PutIdentityProviderRequest) returns (PutIdentityProviderResponse) {
    option (relic.v1.access) = ACCESS_ADMIN;
    option (google.api.http) = {
      put: "/api/v1/identity-providers/{identity_provider.name}"
      body: "identity_provider"
    };
  }
  // DeleteIdentityProvider removes an identity provider. The users it created
  // stay.
  rpc DeleteIdentityProvider(DeleteIdentityProviderRequest) returns (DeleteIdentityProviderResponse) {
    option (relic.v1.access) = ACCESS_ADMIN;
    option (google.api.http) = {
      delete: "/api/v1/identity-providers/{name}"
    };
  }
}

// OidcSettings are Relic's OpenID Connect client settings at a provider.
message OidcSettings {
  // issuer is the provider's issuer URL; Relic reads its discovery document.
  string issuer = 1;
  string client_id = 2;
  // client_secret is write-only.
  string client_secret = 3;
  // scopes default to openid, profile and email.
  repeated string scopes = 4;
}

// SamlSettings are Relic's settings as a SAML service provider.
message SamlSettings {
  // metadata_url or metadata_xml describes the identity provider.
  string metadata_url = 1;
  string metadata_xml = 2;
  // certificate is output only: Relic's certificate for this provider, in PEM.
  string certificate = 3;
}

// IdentityProvider is an identity provider users sign in with.
message IdentityProvider {
  string name = 1;
  // display_name labels the provider's button on the sign-in page.
  string display_name = 2;
  bool enabled = 3;
  // auto_create_users creates a Relic user on a first sign-in.
  bool auto_create_users = 4;
  // username_claim is the claim or attribute holding the username:
  // preferred_username, or the SAML NameID, when empty.
  string username_claim = 5;
  // groups_claim is the claim or attribute listing the user's groups; when
  // set, each sign-in makes the user a member of the Relic groups it names.
  string groups_claim = 6;
  oneof protocol {
    OidcSettings oidc = 7;
    SamlSettings saml = 8;
  }
  // callback_path is output only: the path on Relic the provider sends users
  // back to (the OIDC redirect URI, or the SAML assertion consumer service).
  string callback_path = 9;
}

message ListIdentityProvidersRequest {}

message ListIdentityProvidersResponse {
  repeated IdentityProvider identity_providers = 1;
}

message GetIdentityProviderRequest {
  string name = 1;
}

message GetIdentityProviderResponse {
  IdentityProvider identity_provider = 1;
}

message PutIdentityProviderRequest {
  IdentityProvider identity_provider = 1;
}

message PutIdentityProviderResponse {
  IdentityProvider identity_provider = 1;
}

message DeleteIdentityProviderRequest {
  string name = 1;
}

message DeleteIdentityProviderResponse {}
