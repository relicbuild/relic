apiVersion: v2
name: relic
description: Relic, a self-hosted artifact repository and security platform.
type: application
version: 0.0.0
appVersion: "0.0.0"
dependencies:
  - name: cloudnative-pg
    version: 0.29.1
    repository: https://cloudnative-pg.github.io/charts
    condition: cloudnative-pg.enabled
  - name: cluster
    version: 0.9.0
    repository: https://cloudnative-pg.github.io/charts
    condition: cluster.enabled
  - name: seaweedfs
    version: 4.48.0
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
  - name: kube-prometheus-stack
    version: 92.10.1
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoringStack.enabled
  - name: tempo
    version: 1.24.4
    repository: https://grafana.github.io/helm-charts
    condition: monitoringStack.enabled
  - name: loki
    version: 7.3.0
    repository: https://grafana.github.io/helm-charts
    condition: monitoringStack.enabled
  - name: alloy
    version: 1.13.1
    repository: https://grafana.github.io/helm-charts
    condition: monitoringStack.enabled
