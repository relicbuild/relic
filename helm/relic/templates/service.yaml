apiVersion: v1
kind: Service
metadata:
  name: {{ include "relic.fullname" . }}
  labels: {{- include "relic.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "relic.selector" (dict "root" . "component" "server") | nindent 4 }}
  ports:
    - name: {{ include "relic.serverPortName" . }}
      port: {{ .Values.service.port | default (ternary 443 80 .Values.tls.enabled) }}
      targetPort: {{ include "relic.serverPortName" . }}
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
