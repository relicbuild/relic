{{- $fewestReplicas := ternary .Values.server.autoscaling.minReplicas .Values.server.replicas .Values.server.autoscaling.enabled }}
{{- $drainable := gt (int $fewestReplicas) (int .Values.server.podDisruptionBudget.minAvailable) }}
{{- if and .Values.server.podDisruptionBudget.enabled $drainable (not (include "relic.singleNode" .)) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "relic.fullname" . }}-server
  labels: {{- include "relic.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.server.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "relic.selector" (dict "root" . "component" "server") | nindent 6 }}
{{- end }}
