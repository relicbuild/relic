{{- $fewestReplicas := int (ternary .Values.server.autoscaling.minReplicas .Values.server.replicas .Values.server.autoscaling.enabled) }}
{{- $minAvailable := toString .Values.server.podDisruptionBudget.minAvailable }}
{{- $requiredReplicas := int $minAvailable }}
{{- if hasSuffix "%" $minAvailable }}
{{- $percent := trimSuffix "%" $minAvailable | int }}
{{- $requiredReplicas = div (add (mul $fewestReplicas $percent) 99) 100 }}
{{- end }}
{{- if and .Values.server.podDisruptionBudget.enabled (gt $fewestReplicas (int $requiredReplicas)) (not (include "relic.singleNode" .)) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "relic.fullname" . }}-server
  labels: {{- include "relic.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.server.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "relic.selector" (dict "root" . "component" "server") | nindent 6 }}
{{- end }}
