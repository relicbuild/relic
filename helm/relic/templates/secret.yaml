{{- if not .Values.existingCredentialsSecret }}
{{- $name := include "relic.credentialsSecretName" . }}
{{- $old := dict }}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) }}{{ $old = .data | default dict }}{{ end }}
{{- $stored := dict }}
{{- range $k, $v := $old }}{{ $_ := set $stored $k (b64dec $v) }}{{ end }}
{{- $admin := .Values.credentials.adminPassword | default (get $stored "adminPassword") | default (randAlphaNum 24) }}
{{- $encryptionKey := .Values.credentials.encryptionKey | default (get $stored "encryptionKey") }}
{{- $encryptionKey = required "credentials.encryptionKey (or existingCredentialsSecret) is required: create one with openssl rand -base64 32 and keep a copy; the chart cannot keep a generated key stable under helm template or Argo CD" $encryptionKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "relic.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if and (not .Values.postgresql.enabled) (ne .Values.database.engine "sqlite") }}
  databaseURL: {{ required "credentials.databaseURL (or postgresql.enabled, or existingCredentialsSecret) is required" .Values.credentials.databaseURL | quote }}
  {{- end }}
  {{- if and (not .Values.seaweedfs.enabled) (eq .Values.objectStorage.type "s3") (not .Values.objectStorage.defaultCredentials) }}
  objectStorageAccessKey: {{ required "credentials.objectStorageAccessKey (or seaweedfs.enabled, or existingCredentialsSecret) is required" .Values.credentials.objectStorageAccessKey | quote }}
  objectStorageSecretKey: {{ required "credentials.objectStorageSecretKey (or seaweedfs.enabled, or existingCredentialsSecret) is required" .Values.credentials.objectStorageSecretKey | quote }}
  {{- end }}
  {{- if and (eq .Values.objectStorage.type "azure") (not .Values.objectStorage.defaultCredentials) }}
  objectStorageAzureConnectionString: {{ required "credentials.objectStorageAzureConnectionString (or objectStorage.defaultCredentials, or existingCredentialsSecret) is required" .Values.credentials.objectStorageAzureConnectionString | quote }}
  {{- end }}
  adminPassword: {{ $admin | quote }}
  encryptionKey: {{ $encryptionKey | quote }}
{{- end }}
