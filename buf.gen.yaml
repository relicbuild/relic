version: v2
managed:
  enabled: true
  disable:
    - path: google
  override:
    - file_option: go_package_prefix
      value: relic/api/gen
inputs:
  - directory: api/proto
plugins:
  - local: ["go", "tool", "-modfile=tools/protogen/go.mod", "protoc-gen-go"]
    out: api/gen
    opt: paths=source_relative
  - local: ["go", "tool", "-modfile=tools/protogen/go.mod", "protoc-gen-connect-go"]
    out: api/gen
    opt: paths=source_relative
  - local: ["go", "tool", "-modfile=tools/protogen/go.mod", "protoc-gen-connect-openapi"]
    out: api/apispec
    strategy: all
    opt:
      - path=relic.openapi.json
      - format=json
      - base=api/apispec/base.yaml
      - with-service-descriptions
      - short-service-tags
      - short-operation-ids
      - trim-unused-types
