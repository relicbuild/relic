name: ci

# On demand only (the Actions tab or `gh workflow run ci --ref <branch>`), to
# save GitHub Actions minutes: run it once on a branch before merging.
on:
  workflow_dispatch:
    inputs:
      base:
        description: The commit or tag to check changed files against (default the latest tag)
        required: false
      k8s:
        description: Also run the k8s tier (the Helm chart and everything Kubernetes-specific on kind)
        type: boolean
        default: false
      race:
        description: Run the integration suite with the race detector
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  go-lint:
    name: go:lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  go-vet:
    name: go:vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go tool -modfile=tools/protogen/go.mod buf lint
      - run: go vet ./...
      - run: go mod tidy -diff
      - run: cd api/adapters/artifactory/relic-indexer && go mod tidy -diff
      - run: cd api/adapters/artifactory/compat/sdk && go mod tidy -diff
      - name: unfold
        env:
          BASE: ${{ inputs.base }}
        run: |
          base=${BASE:-$(git describe --tags --abbrev=0)}
          go tool unfold -changed -base "$base"

  go-vulncheck:
    name: go:vulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION ./...

  go-test:
    name: go:test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  go-integration:
    name: go:integration (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        database: [postgresql, sqlite]
    env:
      RELIC_TEST_DATABASE: ${{ matrix.database }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: one PostgreSQL for every package
        if: matrix.database == 'postgresql'
        run: echo "RELIC_TEST_POSTGRESQL_URL=$(test/postgresql.sh)" >>"$GITHUB_ENV"
      # The race detector doubles the suite's time: the unit tests always run
      # with it, the integration suite when the race input is set.
      - run: >-
          go test ${{ inputs.race && '-race' || '' }} -tags integration
          ${{ matrix.database == 'sqlite' && '$(test/database-packages.sh)' || './...' }}

  web-check:
    name: web:check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm gen:api
      - run: git diff --exit-code -- app/gen

  inventory-check:
    name: inventory:check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run ./api/adapters/artifactory/compat/inventory generate -cli "$(api/adapters/artifactory/compat/jf.sh)"
      - run: go run ./api/adapters/artifactory/compat/inventory matrix
      - run: git diff --exit-code api/adapters/artifactory/compat/docs/

  observability-rules:
    name: observability:rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: promtool
        run: |
          promtool() {
            docker run --rm -v "$PWD/deploy/observability/prometheus:/rules:ro" -w /rules \
              --entrypoint promtool prom/prometheus:v3.15.0 "$@"
          }
          promtool check rules relic-rules.yaml
          promtool test rules relic-rules.test.yaml

  e2e:
    name: e2e:${{ matrix.tier }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        tier: [core, platform]
    steps:
      - name: docker on the larger disk
        run: |
          cfg=/etc/docker/daemon.json
          [ -f "$cfg" ] || echo '{}' | sudo tee "$cfg" >/dev/null
          sudo jq '. + {"data-root": "/mnt/docker"}' "$cfg" | sudo tee "$cfg.new" >/dev/null
          sudo mv "$cfg.new" "$cfg"
          sudo systemctl restart docker
          df -h / /mnt
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: matrix.tier == 'core'
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        if: matrix.tier == 'core'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: matrix.tier == 'core'
        working-directory: web
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The client image changes only with its Dockerfile: from the cache.
      # The server image is built by the tests, while their daemons start.
      - name: client image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: test/e2e/client/Dockerfile
          tags: relic-e2e-client:ci
          load: true
          cache-from: type=gha,scope=e2e-client
          cache-to: type=gha,scope=e2e-client,mode=max
      - run: go test -tags e2e -count=1 -v -timeout 80m ./test/e2e -run TestStack -tier ${{ matrix.tier }}
        env:
          RELIC_E2E_CLIENT_IMAGE: relic-e2e-client:ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results-${{ matrix.tier }}
          path: |
            test/e2e/results/
            web/e2e/results/

  e2e-k8s:
    name: e2e:k8s
    if: inputs.k8s
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: docker on the larger disk
        run: |
          cfg=/etc/docker/daemon.json
          [ -f "$cfg" ] || echo '{}' | sudo tee "$cfg" >/dev/null
          sudo jq '. + {"data-root": "/mnt/docker"}' "$cfg" | sudo tee "$cfg.new" >/dev/null
          sudo mv "$cfg.new" "$cfg"
          sudo systemctl restart docker
          df -h / /mnt
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -tags e2e -count=1 -v -timeout 110m ./test/e2e -run TestKubernetes -tier k8s
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results-k8s
          path: test/e2e/results/

  image-build:
    name: image:build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: relic:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
