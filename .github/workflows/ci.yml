name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: The commit or tag to check changed files against (default the latest tag)
        required: false
      k8s:
        description: Also run the k8s tier (the Helm chart and everything Kubernetes-specific on kind)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  go-lint:
    name: go:lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  go-vet:
    name: go:vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go tool -modfile=tools/protogen/go.mod buf lint
      - run: go vet ./...
      - run: go mod tidy -diff
      - run: cd api/adapters/artifactory/relic-indexer && go mod tidy -diff
      - run: cd api/adapters/artifactory/compat/sdk && go mod tidy -diff
      - name: unfold
        env:
          BASE: ${{ inputs.base }}
        run: |
          base=${BASE:-$(git describe --tags --abbrev=0)}
          go tool unfold -changed -base "$base"

  go-vulncheck:
    name: go:vulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION ./...

  go-test:
    name: go:test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  go-integration:
    name: go:integration (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        database: [postgresql, sqlite]
    env:
      RELIC_TEST_DATABASE: ${{ matrix.database }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race -tags integration ${{ matrix.database == 'sqlite' && '$(test/database-packages.sh)' || './...' }}

  web-check:
    name: web:check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm gen:api
      - run: git diff --exit-code -- app/gen

  inventory-check:
    name: inventory:check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run ./api/adapters/artifactory/compat/inventory generate -cli "$(api/adapters/artifactory/compat/jf.sh)"
      - run: go run ./api/adapters/artifactory/compat/inventory matrix
      - run: git diff --exit-code api/adapters/artifactory/compat/docs/

  observability-rules:
    name: observability:rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: promtool
        run: |
          promtool() {
            docker run --rm -v "$PWD/deploy/observability/prometheus:/rules:ro" -w /rules \
              --entrypoint promtool prom/prometheus:v3.15.0 "$@"
          }
          promtool check rules relic-rules.yaml
          promtool test rules relic-rules.test.yaml

  e2e-tier:
    name: e2e:${{ matrix.tier }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        tier: [core, platform]
    steps:
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: matrix.tier == 'core'
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        if: matrix.tier == 'core'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: matrix.tier == 'core'
        working-directory: web
      - run: test/tier.sh ${{ matrix.tier }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.tier }}
          path: |
            api/adapters/artifactory/compat/e2e/results/
            web/e2e/results/

  e2e-k8s:
    name: e2e:k8s
    if: inputs.k8s
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test/tier.sh k8s

  image-build:
    name: image:build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t relic:${{ github.sha }} .
